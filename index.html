<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Portal de Proyectos & Soluciones con IA</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Propuestas comerciales y técnicas de soluciones con Inteligencia Artificial.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- Tema visual moderno de Docsify -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #2563eb;
      --text-color-base: #1e293b;
    }
    .sidebar {
      background-color: #f8fafc;
      border-right: 1px solid #e2e8f0;
    }
    .app-name-link {
      font-weight: 800 !important;
      font-size: 16px !important;
      color: #0f172a !important;
    }
    .markdown-section h1, .markdown-section h2, .markdown-section h3 {
      color: #0f172a;
      font-weight: 700;
    }
    .markdown-section table {
      display: table !important;
      width: 100% !important;
    }
    .markdown-section th {
      background-color: #0f172a;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div id="app">Cargando portal...</div>
  <script>
    window.$docsify = {
      name: '💡 Proyectos IA & EdTech',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        placeholder: 'Buscar en los proyectos...',
        noData: 'No se encontraron resultados',
        depth: 3
      },
      copyCode: {
        buttonText : 'Copiar',
        errorText  : 'Error',
        successText: 'Copiado'
      }
    }
  </script>
  <!-- Docsify Core y Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
</body>
</html>
