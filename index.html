<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Portal de Proyectos & Soluciones con IA</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Propuestas comerciales y técnicas de soluciones con Inteligencia Artificial.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #2563eb;
      --text-color-base: #1e293b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .sidebar {
      background-color: #f8fafc;
      border-right: 1px solid #e2e8f0;
    }
    .app-name-link {
      font-weight: 800 !important;
      font-size: 16px !important;
      color: #0f172a !important;
    }
    .markdown-section h1, .markdown-section h2, .markdown-section h3 {
      color: #0f172a;
      font-weight: 700;
    }
    .markdown-section table {
      display: table !important;
      width: 100% !important;
    }
    .markdown-section th {
      background-color: #0f172a;
      color: #ffffff;
    }

    /* Caja de Edición Amigable */
    .edit-banner {
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      border: 1px solid #93c5fd;
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 5px rgba(37, 99, 235, 0.08);
    }
    .edit-banner-text {
      color: #1e3a8a;
      font-size: 14px;
    }
    .edit-banner-text strong {
      font-size: 15px;
      display: block;
      margin-bottom: 2px;
      color: #1d4ed8;
    }
    .edit-btn {
      background-color: #2563eb;
      color: #ffffff !important;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13.5px;
      text-decoration: none !important;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      transition: all 0.2s ease;
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.25);
    }
    .edit-btn:hover {
      background-color: #1d4ed8;
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(37, 99, 235, 0.35);
    }
  </style>
</head>
<body>
  <div id="app">Cargando portal...</div>
  <script>
    window.$docsify = {
      name: '💡 Proyectos IA & EdTech',
      repo: 'https://github.com/FranBondino/propuesta-integral',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        placeholder: 'Buscar en los proyectos...',
        noData: 'No se encontraron resultados',
        depth: 3
      },
      copyCode: {
        buttonText : 'Copiar',
        errorText  : 'Error',
        successText: 'Copiado'
      },
      plugins: [
        function(hook, vm) {
          hook.beforeEach(function(html) {
            var file = vm.route.file || 'README.md';
            var editUrl = 'https://github.com/FranBondino/propuesta-integral/edit/main/' + file;
            
            var banner = [
              '<div class="edit-banner">',
              '  <div class="edit-banner-text">',
              '    <strong>✏️ Modo Colaborativo</strong>',
              '    ¿Querés modificar o agregar ideas a esta página? Hacé clic en el botón.',
              '  </div>',
              '  <a class="edit-btn" href="' + editUrl + '" target="_blank">',
              '    ✏️ Editar esta página',
              '  </a>',
              '</div>'
            ].join('\n');

            return banner + '\n\n' + html;
          });
        }
      ]
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
</body>
</html>
